<!DOCTYPE html>
<html>
    <body>
        <h2>Javascript Datatypes, Let keyword and Loops</h2>
        <p id="result"></p>
        <script>
            var i; // i is undefined
            var text = ""; {
            let i = 0;
            while (i<10) {
                text += "The values inside the block: " + i + "<br>"; i++;
            }
            document.getElementById("result").innerHTML = text;
            }
        </script>
    </body>
</html>
